name: Auslaenderamt Termin Bot

on:
  schedule:
    - cron: "*/5 * * * *"   # her 5 dakikada bir (GitHub bazen birkaç dakika geciktirir)
  workflow_dispatch:         # "Run workflow" ile elle başlatma
    inputs:
      mode:
        description: "check = normal kontrol | test-notify = test bildirimi | list = Anliegen listesi"
        type: choice
        options: [check, test-notify, list]
        default: check

permissions:
  contents: write            # state.json'ı repoya kaydetmek için

concurrency:
  group: termin-bot
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Randevuları kontrol et
        env:
          # ---- AYARLAR ----------------------------------------------------
          # Bu tarihten ÖNCE boş randevu çıkarsa bildirim gelir (GG.AA.YYYY)
          ALERT_BEFORE: "03.03.2027"
          # İzlenecek Anliegen'ler: "Kategori | Anliegen" (Anliegen yerine sıra no da olur)
          # Başına # koyduğun satır devre dışı kalır.
          TARGETS: |
            Infostelle | Beratungs- und Antragsservice
            # RWTH | 1
          # Günlük "bot çalışıyor" bildirimi saati (Berlin). Boş bırakırsan kapanır.
          HEARTBEAT_HOUR: "9"
          # ---- Gizli bilgiler (Settings > Secrets and variables > Actions) -------
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: python termin_bot.py ${{ inputs.mode == 'test-notify' && '--test-notify' || inputs.mode == 'list' && '--list' || '' }}

      - name: Durumu kaydet
        if: always()
        run: |
          if [ -f state.json ] && [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "termin-bot"
            git config user.email "termin-bot@users.noreply.github.com"
            git add state.json
            git commit -q -m "state güncellendi"
            git pull -q --rebase && git push -q
          fi
